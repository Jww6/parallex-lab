<!DOCTYPE HTML>
    <html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A Falling Story</title>

    <link rel="stylesheet" href="css/style.css">
    <script defer src="js/script.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap" rel="stylesheet">
  </head>

<body>
    <section class="falling1">
      <div class="card">
        <p>It's all over.</p>
      </div>
      <div class="scroll-hint">↓</div>
    </section>

    <section class="falling2">
       <div class="card">
        <p>I'm falling to the bottom of my life.</p>
       </div>
       <div class="scroll-hint">↓</div>
    </section>

    <section class="falling3">
      <div class="card">
        <p>All the bad things happened.</p>
      </div>
      <div class="scroll-hint">↓</div>
    </section>

     <section class="falling4">
      <div class="card">
        <p>...</p>
      </div>
      <div class="scroll-hint">↓</div>
    </section>

    <section class="surprise">
      <div class="card">
        <p>Oh....!</p>
      </div>
      <div class="scroll-hint">↓</div>
    </section>

    <section class="flowers">
      <div class="card">
      <p>Don't be obsessed with the present good or bad situations.</p>
      <p>You will never know</p>
      <p>where the life will lead you</p>
      </div>
    </section>
  </body>
</html>
